# Render blueprint for Cadence's encrypted sync relay (free plan).
# It stores only ciphertext under random IDs. See server/src/db.js.
services:
  - type: web
    name: cadence-sync
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string in the Render dashboard
      - key: CORS_ORIGINS
        value: https://suhxnitiwari.github.io
      - key: NODE_VERSION
        value: "22"
