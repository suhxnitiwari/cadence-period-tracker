name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      # Includes the product guardrails: nothing deploys if fertility or "late" language slips in.
      - run: npm test
      - run: npm ci && npm test
        working-directory: server
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Set the SYNC_URL repository variable once the relay is deployed. Until then,
          # the app works fully on-device and "Share with another phone" says it isn't on yet.
          VITE_SYNC_URL: ${{ vars.SYNC_URL }}
      # Lets deep links like /calendar load the app on GitHub Pages.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
